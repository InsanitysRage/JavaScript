<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Types</title>
</head>

<body>

</body>
<script>
  //string: this is a sequence of characters enclosed in single quotes '' or double quotes "".

  let name = "Aaron"

  //number: this is a numerical value.

  let age = 32;

  //boolean: this is a logical value that is either true or false.

  let isStudent = false;

  //undefined: this is a variable that hasw been declared but not assigned a value.

  let myVariable;

  //null: represents a deliberate non-value or null value.

  let myVariable2 = null;

  //object: represents a collection of key-value pairs. objects can contain properties and methods and are used to store and manipulate more complex data structures.

  let person = {
    name: "Aaron",
    age: 32,
    isStudent: false,
  };

  //array: represents an ordered list of values. can contain elements of any data type.

  let numbers = [0, 1, 2, 3, 4, 5];

  //function represents a reusable block of code that performs a task

  function greet(name) {
    console.log("Hello, " + name + "!");
  };
  greet(name);


</script>

</html>
