<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Array Examples</title>
</head>

<body>
  <script>
    //Array of numerical values

    let numbers = [1, 2, 3, 4, 5];

    //Array of strings

    let fruits = ["apple", "banana", "orange", "grape"];

    //Array of mixed data types

    let mixedArray = [1, "hello", true, null, { name: "John" }, [1, 2, 3]];

    //Array of objects

    let students = [
      { name: "John", age: 20 },
      { name: "Jane", age: 22 },
      { name: "Mark", age: 21 },
    ];

    //Array of other arrays that we call a Matrix

    let matrix = [
      [1, 2, 3],
      [4, 5, 6],
      [7, 8, 9],
    ];

    // Array of other arrays with different lengths

    let nestedArray = [
      ["a", "b", "c"],
      ["d", "e"],
      ["f", "g", "h", "i"],
    ];

    //An empty Array

    let emptyArray = [];


  </script>
</body>

</html>
