<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Array Example</title>
</head>

<body>
  <div>
    <h1>Array Example Two</h1>
    <h1>Library</h1>
    <input type="text" id="searchInput" placeholder="Enter book title to search">
    <button onclick="searchBook()">Search</button>
    <div id="searchResult"></div>

    <h2>Add New Book</h2>
    <form id="addBookForm">
      <label for="bookTitle">Title:</label>
      <input type="text" id="bookTitle" required>
      <button type="submit">Add Book</button>
    </form>

    <div id="bookList"></div>
  </div>
  <script>
    // Array Example 2

    let library = [
      "Eragon",
      "Eldest",
      "Brisingr",
      "Inheritance",
      "Murtagh"
    ];

    function displayBooks() {
      let bookList = document.getElementById("bookList");
      bookList.innerHTML = "";

      library.forEach(function (title, index) {
        let bookInfo = document.createElement("p");
        bookInfo.textContent = `${index + 1}. ${title}`;
        bookList.appendChild(bookInfo);
      });
    }

    function addBook(event) {
      event.preventDefault();

      let titleInput = document.getElementById("bookTitle");
      let title = titleInput.value;

      library.push(title);

      titleInput.value = "";

      displayBooks();
    }

    function searchBook() {
      let searchInput = document.getElementById("searchInput").value.toLowerCase();
      let searchResult = document.getElementById("searchResult");
      searchResult.innerHTML = "";

      let foundBooks = library.filter(function (title) {
        return title.toLowerCase().includes(searchInput);
      });

      foundBooks.forEach(function (title, index) {
        let bookInfo = document.createElement("p");
        bookInfo.textContent = `${title}`;
        searchResult.appendChild(bookInfo);
      });
    }

    document.getElementById("addBookForm").addEventListener("submit", addBook);

    displayBooks();
  </script>
</body>

</html>
